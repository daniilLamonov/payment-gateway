# Временный конфиг ТОЛЬКО для первичного выпуска сертификата.
# После получения сертификата заменяется на nginx.prod.conf.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'certbot bootstrap ok';
        add_header Content-Type text/plain;
    }
}
